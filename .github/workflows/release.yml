name: Release OmaViewer (Linux & Windows)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux Tauri dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and publish OmaViewer
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "OmaViewer v__VERSION__"
          releaseBody: |
            ## OmaViewer — Fast, Modern 100% Offline FOSS PDF Studio

            Download the installer for your platform below:
            - **Windows**: `.exe` (NSIS setup) or `.msi`
            - **Linux**: `.AppImage`, `.deb`, or `.rpm`

            ---
            ☕ Enjoying OmaViewer? [Buy Me a Coffee](https://buymeacoffee.com/aurorauap) to support future updates!
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
